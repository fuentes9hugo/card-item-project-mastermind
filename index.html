<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:wght@300..800&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/cb00f18dc9.js" crossorigin="anonymous"></script>
    <title>Card Item</title>
</head>
<body>
    <div class="card-item">
        <div class="card-img"><img src="./images/card-item-product.webp" alt="Goku chibi product"></div>
        <div class="card-content">
            <div class="card-header">
                <div><span class="offer-label">ENVÍO GRATUITO</span></div>
                <div class="cart"><i class="fa-solid fa-cart-shopping"></i> <span id="cart-number">1</span></div>
            </div>
            <h3>Goku Super Saiyan Funko Chibi</h3>
            <p><span class="price">128 <i class="fa-solid fa-euro-sign"></i></span></p>
            <button class="btn-primary">COMPRAR</button>
            <p class="stock"><i class="fa-solid fa-circle stock-circle"></i> <span id="stock-number">20</span> Unidades en stock</p>
            <div class="secondary-actions"><button class="btn-secondary">AÑADIR AL CARRITO</button><button class="btn-secondary">AÑADIR A FAVORITOS</button></div>
        </div>
    </div>
</body>
</html>
